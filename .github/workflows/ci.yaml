name: linkedin_test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linkedin_test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEBUG: ${{ secrets.DEBUG }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_REDIRECT_URI: ${{ secrets.LINKEDIN_REDIRECT_URI }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FERNET_KEY: ${{ secrets.FERNET_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      OOPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      APP_ENV: ${{ secrets.APP_ENV }}
      APP_NAME: ${{ secrets.APP_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run App
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          APP_PID=$!
      
          echo "Waiting for FastAPI..."
      
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8000/docs > /dev/null; then
              echo "FastAPI is running!"
              break
            fi
      
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "FastAPI crashed!"
              cat uvicorn.log
              exit 1
            fi
      
            sleep 1
          done
      
          curl --fail http://localhost:8000/docs
      
          kill $APP_PID
            
      - name: DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/linkedops:latest
